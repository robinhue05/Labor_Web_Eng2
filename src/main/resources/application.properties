# App name, shows up in logs
spring.application.name=skywatch

# Server port (8080 is the default anyway)
server.port=8080

# Pretty-print JSON responses, dev only
spring.jackson.serialization.indent-output=true

# H2 in-memory database (data is gone after a restart)
spring.datasource.url=jdbc:h2:mem:skywatch
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console - never enable this in production!
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates/updates tables from our entities (dev only, prod uses Flyway/Liquibase)
# (no dialect setting needed, Hibernate detects H2 on its own)
spring.jpa.hibernate.ddl-auto=update

# print the generated SQL to the console, nicely formatted
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI (default path is /swagger-ui.html anyway)
springdoc.swagger-ui.path=/swagger-ui.html
# sort endpoints by HTTP method and tags alphabetically
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# in production: turn these off (or protect them)
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false

# NASA NEO API
nasa.api.base-url=https://api.nasa.gov
# takes the env variable NASA_API_KEY if set, otherwise DEMO_KEY - never put a real key here!
nasa.api.key=${NASA_API_KEY:DEMO_KEY}
# don't wait forever if NASA is slow
nasa.api.connect-timeout-ms=2000
nasa.api.read-timeout-ms=5000
