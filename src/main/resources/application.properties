# App name, shows up in logs
spring.application.name=skywatch

# Server port (8080 is the default anyway)
server.port=8080

# Pretty-print JSON responses, dev only
spring.jackson.serialization.indent-output=true

# H2 in-memory database (data is gone after a restart)
spring.datasource.url=jdbc:h2:mem:skywatch
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console - never enable this in production!
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates/updates tables from our entities (dev only, prod uses Flyway/Liquibase)
# (no dialect setting needed, Hibernate detects H2 on its own)
spring.jpa.hibernate.ddl-auto=update

# print the generated SQL to the console, nicely formatted
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
